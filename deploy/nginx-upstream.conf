# Both ports of the app (see deploy/README.md). Normally only one runs; nginx tries the other when a
# port refuses the connection, also for POST and other writes, as nothing was sent yet.
# max_fails=0: never mark a port as down. Otherwise the new release's port, refused until the
# deploy started it, would count as down for a while, and once the old one stops nginx would answer
# 502. A refused connection on localhost costs next to nothing.
upstream taskz {
    server 127.0.0.1:8081 max_fails=0;
    server 127.0.0.1:8082 max_fails=0;
}

# In the server block, every proxy_pass to the app (e.g. http://127.0.0.1:8080) becomes:
#     proxy_pass http://taskz;
# The rest of the location blocks (headers, buffering, client_max_body_size) stays as it is.
