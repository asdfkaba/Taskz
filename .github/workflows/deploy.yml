name: Deploy to Server
on:
  push:
    branches: [ main ]
# One deploy at a time: two merges in a row ran side by side, and the older build was copied last.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    # Only deploy what passed the backend and browser tests.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Vue
        run: |
          cd task-frontend
          npm ci
          npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Vue build to server
        run: |
          scp -O -i ~/.ssh/deploy_key -r task-frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/spring/

      # Every deploy copies all current assets anew (fresh mtime), so files older than a week belong
      # to builds no open tab still loads chunks from.
      - name: Remove old frontend assets
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "find /var/www/spring/assets -type f -mtime +7 -delete"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # The tests ran in the "tests" job above.
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to server
        run: |
          scp -O -i ~/.ssh/deploy_key target/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/moritz/tasks/

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mv /home/moritz/tasks/taskz-*.jar /home/moritz/tasks/tasks.jar && export XDG_RUNTIME_DIR=/run/user/1000 && systemctl --user restart tasks"
