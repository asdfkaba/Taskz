name: Deploy to Server
on:
  push:
    branches: [ main ]
# One deploy at a time: two merges in a row ran side by side, and the older build was copied last.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    # Only deploy what passed the backend and browser tests.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Vue
        run: |
          cd task-frontend
          npm ci
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # The tests ran in the "tests" job above.
      - name: Build with Maven
        run: |
          ./mvnw clean package -DskipTests
          cp target/taskz-*.jar taskz.jar

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy release to server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "rm -rf ~/tasks/incoming && mkdir -p ~/tasks/incoming"
          scp -O -i ~/.ssh/deploy_key -r taskz.jar task-frontend/dist deploy/release.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:tasks/incoming/

      # Starts the new release next to the old one and switches over without downtime; the
      # frontend follows once the backend is live (deploy/README.md).
      - name: Release
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash ~/tasks/incoming/release.sh ~/tasks/incoming"
